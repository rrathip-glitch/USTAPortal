        function Trim(StringToTrim) {
            if (StringToTrim.charAt(0) == ' ') {
                for (var i = 0; i < StringToTrim.length; i++) {
                    if (StringToTrim.charAt(i) != ' ') {
                        break;
                    }
                }
                StringToTrim = StringToTrim.substring(i, StringToTrim.length);
            }
            if (StringToTrim.charAt(StringToTrim.length - 1) == ' ') {
                for (i = StringToTrim.length - 1; i > 0; i--) {
                    if (StringToTrim.charAt(i) != ' ') {
                        break;
                    }
                }
                StringToTrim = StringToTrim.substring(0, i + 1);
            }
            return StringToTrim;
        }

        function SearchPlayerRecord() {
            var errMessage = $("#errorSection_FindPlayerRecord");
            errMessage.hide();
            var $ustaNum = $("#player_usta_number input");
            var $playerName = $("#record_player_name input");

            var strUstaNum = Trim($ustaNum.val());
            var strPlayerName = Trim($playerName.val());

                if (strPlayerName == '') {
                    errMessage.text('Please enter a valid USTA number or Name.').show();
                    // Add error highlight
                    $ustaNum.addClass('inputErrorHighlight').focus();
                    return false;
                }
                else {
                    var result = validateSearchMemberName(strPlayerName);
                    if (!result.success) {
                        errMessage.text(result.error).show();
                        $playerName.addClass('inputErrorHighlight').focus();
                        return false;

                 ($("#end_date input").val() != '' && !IsDate($("#end_date input"))))

        function IsDate(element) {
            var aDate = element.val().match(/\d+/g);
            var bDateOK = true;

            if (aDate != null) {
                var aMonthDays = new Array(31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31);
                var iMonth = '';
                var iDay = '';
                var iYear = '';

                if (aDate.length == 1 && (aDate[0].length == 6 || aDate[0].length == 8)) {
                    iMonth = aDate[0].substr(0, 2);
                    iDay = aDate[0].substr(2, 2);
                    iYear = (aDate[0].length == 6) ? aDate[0].substr(4, 2) : aDate[0].substr(4, 4);
                } else if (aDate.length > 2) {
                    iMonth = aDate[0];
                    iDay = aDate[1];
                    iYear = aDate[2];
                } else {
                    bDateOK = false;
                }

                //Check Year
                if (bDateOK) {
                    if (iYear.length == 2 || iYear.length == 4) {
                        if (iYear.length == 2) { iYear = (iYear >= 20) ? iYear = "19" + iYear : "20" + iYear; }

                        // Check For Leap Year
                        if ((iYear % 4 == 0 && iYear % 100 != 0) || (iYear % 400 == 0)) {
                            aMonthDays[1] = 29;
                        }
                    } else {
                        bDateOK = false;
                    }
                }

                //Check Month
                if (bDateOK && (iMonth < 1 || iMonth > 12)) {
                    bDateOK = false;
                }

                //Check Day
                if (bDateOK && (iDay < 0 || iDay > aMonthDays[iMonth - 1])) {
                    bDateOK = false;
                }

                if (bDateOK) {
                    iMonth = (iMonth.length == 1) ? '0' + iMonth : iMonth;
                    iDay = (iDay.length == 1) ? '0' + iDay : iDay;
                    //oForm.elements[sField].value = iMonth + '/' + iDay + '/' + iYear;
                }
            } else {
                bDateOK = false;
            }
            return bDateOK;
        }

        function CDate(sDate) {
            return new Date(sDate);
        }

        function Pager(tableName, itemsPerPage) {
            this.tableName = tableName;
            this.itemsPerPage = itemsPerPage;
            this.currentPage = 1;
            this.pages = 0;
            this.inited = false;

            this.showRecords = function(from, to) {
                var rows = document.getElementById(tableName).rows;

                // i starts from 2 to skip table header & sub-header rows
                for (var i = 2; i < rows.length; i++) {
                    if (i < from || i > to)
                        rows[i].style.display = 'none';
                    else
                        rows[i].style.display = '';
                }
            }

            this.showPage = function(pageNumber) {
                if (!this.inited) {
                    alert("not inited");
                    return;
                }

                var oldPageAnchor = document.getElementById('pg' + this.currentPage + tableName);
                oldPageAnchor.className = 'pg-normal';

                this.currentPage = pageNumber;
                var newPageAnchor = document.getElementById('pg' + this.currentPage + tableName);
                newPageAnchor.className = 'pg-selected';

                var from = (pageNumber - 1) * itemsPerPage + 2;
                var to = from + itemsPerPage - 1;
                this.showRecords(from, to);
            }

            this.prev = function() {
                if (this.currentPage > 1)
                    this.showPage(this.currentPage - 1);
            }

            this.next = function() {
                if (this.currentPage < this.pages) {
                    this.showPage(this.currentPage + 1);
                }
            }

            this.init = function() {
                var rows = document.getElementById(tableName).rows;
                var records = (rows.length - 2);
                this.pages = Math.ceil(records / itemsPerPage);
                this.inited = true;
            }

            this.showPageNav = function(pagerName, positionId) {
                if (!this.inited) {
                    alert("not inited");
                    return;
                }
                var element = document.getElementById(positionId);

                var pagerHtml = '<span onclick="' + pagerName + '.prev();" class="pg-normal"> &#171 Prev </span> ';
                for (var page = 1; page <= this.pages; page++)
                    pagerHtml += '<span id="pg' + page + tableName + '" class="pg-normal" onclick="' + pagerName + '.showPage(' + page + ');">' + page + '</span> ';
                pagerHtml += '<span onclick="' + pagerName + '.next();" class="pg-normal"> Next &#187;</span>';

                element.innerHTML = pagerHtml;
            }
        }

     <script type="text/javascript">
         (function () {
             function addSelectOptions(arr, id, selVal, keyField, valueField, dataField) {
                 var $sel = $("#" + id);
                 if (!arr || arr.length == 0 || $sel.length == 0) return;
                 for (var i = 0; i < arr.length; i++) {
                     var item = arr[i], str;
                     var val = valueField ? item[valueField] : item;
                     var key = keyField ? item[keyField] : item;

                     if (selVal && selVal == val) {
                         if (dataField) {
                             str = String.format("<option value='{0}' data-{2}='{3}' selected='selected'>{1}</option>", key, val, dataField, item[dataField]);
                         } else {
                             str = String.format("<option value='{0}' selected='selected'>{1}</option>", key, val);
                         }
                     } else {
                         if (dataField) {
                             str = String.format("<option value='{0}' data-{2}='{3}'>{1}</option>", key, val, dataField, item[dataField]);
                         } else {
                             str = String.format("<option value='{0}'>{1}</option>", key, val);
                         }
                     }
                     $sel.append(str);
                 }
             }
             function selectSearchPlayerCriteriaYear() {
                 var $span = $(this), sYear = $span.text(),
                     $yearAll = $(".search-player-name-year-btn.all");
                 if (sYear != 'All') {
                     if ($span.hasClass("selected")) {
                         $span.removeClass("selected");
                     } else {
                         $span.addClass("selected");
                         $yearAll.removeClass("selected");
                     }
                 } else {
                     $(".search-player-name-year-btn").not(".all").removeClass("selected");
                     $yearAll.addClass("selected");
                     //Once the 'All' button is clicked, we will keep this hidden field's value as 'true', 
                     //until user re-start a totally new search.
                     $('#ctl00_mainContent_filter_bar_all_year_clicked').val('True');
                 }
                 updateCriteriaYearValue();
             }

             function updateCriteriaYearValue() {
                 var val = "", $criteriaYearHiddenField = $("#search_player_name_criteria_year");
                 $(".search-player-name-year-btn").not(".all").each(function () {
                     if (!$(this).hasClass("selected")) return;
                     if (val.length > 0) {
                         val += "," + $(this).text();
                     } else {
                         val += $(this).text();
                     }
                 });
                 $criteriaYearHiddenField.val(val);
                 if (val.length == 0) $(".search-player-name-year-btn.all").addClass("selected");
             }

             function isArrayContain(item, arr) {
                 if (arr && arr.length > 0) {
                     for (var i = 0; i < arr.length; i++) {
                         if (item == arr[i]) return true;
                     }
                 }
                 return false;
             }
             var loadSearchPlayerCriteria = window.loadSearchPlayerCriteria = function () {
                 var arrFirstLoadYears = null;
                 var $jsonSearchPlayerFirstLoadYear = $('#ctl00_mainContent_json_searchPlayerFirstLoadYear');
                 if ($jsonSearchPlayerFirstLoadYear.length > 0) {
                     var val = $jsonSearchPlayerFirstLoadYear.val();
                     if (val) {
                         arrFirstLoadYears = val.split(",");
                    }
                 }

              //ex:{ "City": ["San Antonio", "Miami", "Corpus Christi", "Midland"], "State": ["TX", "GA"], "Year": [2015, 2014, 2013, 2012, 2011] };
              var jsonSearchPlayerResultCriteria = null;
              var $jsonSearchPlayerResultCriteria = $('#ctl00_mainContent_json_searchPlayerResultCriteria');
              if ($jsonSearchPlayerResultCriteria.length > 0) {
                  var val = $jsonSearchPlayerResultCriteria.val();
                  if (val) jsonSearchPlayerResultCriteria = JSON.parse(val);
              }

              if (jsonSearchPlayerResultCriteria == null && jsonSearchPlayerResultCriteria == null) return;

              var jsonSearchPlayerFilterCriteria = jsonSearchPlayerResultCriteria.SelectedCriteria;

              var $divDateRange = $("#div_search_player_name_date_range");
              var $divYears = $("#div_search_player_name_criteria_year");

              var blnIsSearchedByDateRange = $('#ctl00_mainContent_hdnIsSearchedByDateRange').val();
              var blnFilterBarAllYearClicked = $('#ctl00_mainContent_filter_bar_all_year_clicked').val();

              if (blnIsSearchedByDateRange == "true" && blnFilterBarAllYearClicked == "False") {
                  $divDateRange.show();
                  $divYears.hide();
              } else {
                  $divDateRange.hide();
                  $divYears.show();
                  if ($divYears.length > 0) {
                      var yearAllBtn = $('<span class="search-player-name-year-btn all">All</span>').click(selectSearchPlayerCriteriaYear);
                      if (jsonSearchPlayerFilterCriteria != null && (!jsonSearchPlayerFilterCriteria.Year || jsonSearchPlayerFilterCriteria.Year.length == 0) && blnFilterBarAllYearClicked == "True") {
                          yearAllBtn.addClass("selected");
                      }
                      $divYears.append(yearAllBtn);
                      for (var i = 0; i < jsonSearchPlayerResultCriteria.Year.length; i++) {
                          var iYear = jsonSearchPlayerResultCriteria.Year[i];
                          var $span = $('<span class="search-player-name-year-btn">' + iYear + '</span>').click(selectSearchPlayerCriteriaYear);

                          if (jsonSearchPlayerFilterCriteria == null) {
                              if (isArrayContain(iYear, arrFirstLoadYears)) {
                                  $span.addClass("selected");
                              }
                          } else {
                              if (jsonSearchPlayerFilterCriteria.Year && jsonSearchPlayerFilterCriteria.Year.length > 0) {
                                  if (isArrayContain(iYear, jsonSearchPlayerFilterCriteria.Year)) {
                                      $span.addClass("selected");
                                  }
                              } else if (blnFilterBarAllYearClicked == "False") {
                                  if (isArrayContain(iYear, arrFirstLoadYears)) {
                                      $span.addClass("selected");
                                  }
                              }
                          }
                          $divYears.append($span);
                      }
                      updateCriteriaYearValue();
                  }
              }
              
              var defCity = jsonSearchPlayerFilterCriteria ? jsonSearchPlayerFilterCriteria.City : null;
              var defState = jsonSearchPlayerFilterCriteria ? jsonSearchPlayerFilterCriteria.State : null;
              addSelectOptions(jsonSearchPlayerResultCriteria.City, "search_player_name_criteria_city", defCity);
              addSelectOptions(jsonSearchPlayerResultCriteria.State, "search_player_name_criteria_state", defState);

              if (jsonSearchPlayerFilterCriteria && jsonSearchPlayerFilterCriteria.Gender && jsonSearchPlayerFilterCriteria.Gender.length > 0) {
                  $("#search_player_name_criteria_gender").val(jsonSearchPlayerFilterCriteria.Gender);
              }
             }

                 errMessage.html(error);
                 errMessage.show();
             }

                 var reg = /\D/;
                 return value.match(reg) == null;

             window.validateSearchPlayerFromResultPage = function () {
